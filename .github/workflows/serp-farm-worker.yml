name: Detector de bots — worker (cola)

# Reemplaza a un servidor always-on.
#
# Dos disparadores, a propósito:
#  - repository_dispatch: instantáneo, lo manda la API al encolar una consulta. Depende
#    de que GITHUB_DISPATCH_TOKEN esté cargado en Netlify; si falta o es inválido, no
#    llega nada y no hay forma de notarlo desde acá.
#  - schedule: la red de seguridad que hace que la herramienta funcione igual sin ese
#    token. Estaba cada 6 horas, que es lo que tardaba en salir un informe cuando el
#    disparo fallaba. Este repo es público, así que Actions no se cobra: cada 10 minutos
#    no cuesta nada y vuelve aceptable el peor caso.
on:
  repository_dispatch:
    types: [serp-farm-job]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

# Evita que dos corridas se solapen (igual el claim usa FOR UPDATE SKIP LOCKED).
concurrency:
  group: serp-farm-worker
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependencias
        run: pip install -r worker/requirements.txt

      - name: Procesar un job PENDING
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: python -m worker.main --from-db
