name: Post semanal de Noticias Tech

# Corre todos los miércoles a las 11:00 UTC (08:00 Argentina).
# También se puede disparar a mano desde la pestaña "Actions" → "Run workflow".
on:
  schedule:
    - cron: '0 11 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar el post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generar-noticias.mjs

      - name: Commit y push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️ Sin cambios que commitear."
            exit 0
          fi
          git add data/posts.ts content/blog public/images/blog
          git commit -m "blog: post automático de Noticias Tech ($(date -u +%Y-%m-%d))"
          # Reintentar el push rebasando por si origin/main avanzó durante la corrida.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "✅ Post publicado."
              echo "publicado=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ Push rechazado (intento $intento). Rebaso sobre origin/main y reintento…"
            git pull --rebase origin main
          done
          echo "❌ No se pudo pushear tras varios intentos."
          exit 1

      # Netlify a veces no construye los commits del bot; el build hook lo fuerza.
      - name: Disparar deploy en Netlify
        if: steps.push.outputs.publicado == 'true'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "⚠️ Falta el secret NETLIFY_BUILD_HOOK: el deploy depende de que Netlify detecte el push."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "🚀 Deploy de Netlify disparado."
