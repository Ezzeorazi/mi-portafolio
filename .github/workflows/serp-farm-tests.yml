name: Detector de bots — tests

# Tests del worker Python. Corre en push/PR que toquen worker/ (o este workflow).
# No hay pipeline de CI previo en el repo, así que este es el de tests del módulo.
on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/serp-farm-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/serp-farm-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r worker/requirements-dev.txt

      - name: Correr tests
        run: python -m pytest worker/tests -q
